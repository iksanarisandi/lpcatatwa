            <h1>Catat Keuangan <span class="highlight">Bareng Tim</span> Menggunakan WhatsApp</h1>

            <p class="lead">Keuangan rumah tangga atau tim kerja sering berantakan karena dicatat sendiri-sendiri?
                Dengan <strong>aplikasi keuangan multi user</strong> berbasis WhatsApp, kamu dan pasangan, tim, atau
                ortu-anak bisa mencatat transaksi ke akun yang sama dari nomor masing-masing — tanpa install app.</p>

            <div class="cta-box">
                <p style="margin-bottom:16px"><strong>Coba gratis sekarang, langsung dari WhatsApp!</strong></p>
                <a href="https://wa.me/6285796731972?text=Halo%2C%20saya%20mau%20coba%20aplikasi%20keuangan%20multi%20user%20untuk%20tim"
                    class="btn-cta" target="_blank" rel="noopener">Mulai Catat Bareng →</a>
            </div>

            <h2>Masalah Keuangan yang Dikelola Sendiri-Sendiri</h2>
            <p>Mengelola uang bersama itu wajar, tapi mencatatnya terpisah-pisah justru sumber masalah. Masing-masing
                pihak hapal pengeluaran sendiri, lalu saat direkap hasilnya gak cocok. Beberapa masalah klasiknya:</p>
            <ul>
                <li><strong>Suami istri gak sinkron soal pengeluaran.</strong> "Kamu kemarin belanja berapa?" — ujungnya
                    berdebat.</li>
                <li><strong>Tim kerja lupa iuran.</strong> Kas tim sepi karena gak ada yang catat siapa sudah setor.</li>
                <li><strong>Anak kos bon terus.</strong> Ortu gak tahu berapa uang yang sudah dikasih bulan ini.</li>
                <li><strong>Arus kas usaha rumahan kabur.</strong> Uang pribadi dipakai modal, tapi cuma satu orang yang
                    catat.</li>
                <li><strong>Susah rekap bersama.</strong> Harus kirim screenshot sana-sini, capek dan rawan ketinggalan.</li>
            </ul>
            <p>Solusinya adalah satu catatan yang bisa <span class="highlight">diisi bersama dari beberapa nomor</span>,
                sehingga semua pihak selalu melihat data yang sama dan terkini.</p>

            <h2>Kenapa WhatsApp Cocok untuk Catat Bareng</h2>
            <p>WhatsApp sudah jadi aplikasi yang dipakai tiap hari, baik untuk keluarga maupun tim. Menggunakannya
                sebagai alat catat keuangan bersama bikin semuanya natural:</p>
            <ul>
                <li>👥 <strong>Gak perlu install app baru</strong> — semua orang sudah punya WhatsApp.</li>
                <li>👥 <strong>Catat dari nomor masing-masing</strong> — tinggal chat bot yang sama.</li>
                <li>👥 <strong>Catat seperti chat teman</strong> — ketik bebas atau voice note.</li>
                <li>👥 <strong>Otomatis tergabung</strong> — semua transaksi masuk ke akun bersama.</li>
                <li>👥 <strong>Bisa dicek bareng</strong> — semua anggota lihat data yang sama lewat dashboard.</li>
            </ul>

            <h2>Cara Kerja Aplikasi Keuangan Multi User</h2>
            <p>Gampang banget, hanya tiga langkah:</p>
            <ol>
                <li><strong>Buat akun & daftarkan anggota.</strong> Pemilik akun mendaftarkan nomor WhatsApp anggota
                    (pasangan, tim, atau anak) lewat dashboard atau chat bot.</li>
                <li><strong>Catat dari nomor masing-masing.</strong> Tiap anggota chat nomor bot yang sama — ketik
                    <code>beli sayur 30rb</code> atau kirim voice note. Transaksi otomatis masuk ke catatan bersama.</li>
                <li><strong>Cek & rekap bersama.</strong> Ketik <code>rekap</code> untuk melihat ringkasan gabungan.
                    Detail lengkap bisa dilihat bareng-bareng di dashboard web.</li>
            </ol>
            <p>Dengan begini, semua orang tahu posisi keuangan terkini tanpa harus tanya-menerus lewat chat keluarga
                atau grup kerja.</p>

            <h2>Untuk Siapa Fitur Multi User Ini?</h2>
            <p>Fitur catat bersama cocok untuk berbagai situasi keuangan kolaboratif:</p>
            <ul>
                <li><strong>Pasangan suami-istri.</strong> Gabungkan pengeluaran rumah tangga jadi satu, transparan dan
                    gak berdebat.</li>
                <li><strong>Tim kerja / arisan / komunitas.</strong> Catat iuran dan pengeluaran kas tim bersama-sama.</li>
                <li><strong>Orang tua dan anak kos.</strong> Pantau uang saku dan pengeluaran anak dari jauh.</li>
                <li><strong>Usaha keluarga.</strong> Catat omzet dan modal yang dipegang beberapa anggota keluarga.</li>
                <li><strong>Sahabat patungan.</strong> Catat siapa sudah setor dan berapa tagihan masing-masing.</li>
            </ul>

            <h2>Fitur Penting untuk Keuangan Bareng</h2>
            <p>Selain multi user, fitur lainnya bikin keuangan tim makin rapi:</p>
            <ul>
                <li><strong>Catat teks / bahasa bebas (AI)</strong> — paham gaya bahasa Indonesia & slang.</li>
                <li><strong>Scan struk OCR</strong> — foto nota belanja, data otomatis terekam.</li>
                <li><strong>Catat via suara</strong> — voice note untuk yang lagi sibuk.</li>
                <li><strong>Kategori otomatis & rekap harian-bulanan</strong> — ringkasan otomatis untuk semua anggota.</li>
                <li><strong>Export CSV/Excel & dashboard web</strong> — laporan transparan untuk seluruh tim.</li>
                <li><strong>Utang-piutang + pengingat & tabungan</strong> — kelola bon dan target nabung bareng.</li>
            </ul>

            <p>Untuk pasangan yang baru mulai catat bareng, paket <strong>Starter</strong> sudah mendukung +1 nomor
                anggota. Untuk tim atau keluarga besar yang butuh banyak anggota dan analisa, naik ke <strong>Premium</strong>
                atau <strong>Pro</strong> dengan +2 sampai +4 nomor.</p>

            <h2>Tips Mengelola Keuangan Bareng Tim</h2>
            <ul>
                <li><strong>Set aturan dari awal.</strong> Sepakati apa saja yang dicatat dan siapa pencatat utama.</li>
                <li><strong>Catat langsung, jangan nunggu.</strong> Biar tidak ada transaksi yang tertinggal.</li>
                <li><strong>Pakai kategori yang disepakati.</strong> Biar rekapnya mudah dipahami semua orang.</li>
                <li><strong>Rekap tiap minggu bareng.</strong> Evaluasi pengeluaran dan atur anggaran minggu depan.</li>
                <li><strong>Transparan lewat dashboard.</strong> Semua anggota bisa lihat, gak ada yang merasa dicurigai.</li>
            </ul>

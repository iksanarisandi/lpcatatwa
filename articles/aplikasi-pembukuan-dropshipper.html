            <h1>Aplikasi Pembukuan untuk <span class="highlight">Dropshipper</span></h1>

            <p class="lead">Jualan dropship tanpa pegang stok, tapi keuangan malah berantakan? Dengan <strong>aplikasi
                    pembukuan dropshipper</strong> berbasis WhatsApp, kamu bisa mencatat setiap order, modal supplier,
                ongkir, dan margin per transaksi langsung dari chat — tanpa install app, tanpa bikin rumus Excel.</p>

            <div class="cta-box">
                <p style="margin-bottom:16px"><strong>Coba gratis sekarang, langsung dari WhatsApp!</strong></p>
                <a href="https://wa.me/6285796731972?text=Halo%2C%20saya%20mau%20coba%20aplikasi%20pembukuan%20untuk%20dropshipper"
                    class="btn-cta" target="_blank" rel="noopener">Mulai Catat Margin →</a>
            </div>

            <h2>Tantangan Pembukuan untuk Dropshipper</h2>
            <p>Dropship punya keunikan dibanding model jualan lain: kamu gak menyimpan stok, produk diambil dari katalog
                supplier, dan setiap order punya komposisi biaya yang beda-beda. Sayangnya banyak dropshipper justru
                kerepotan saat mencatat keuangan. Beberapa masalah yang sering muncul:</p>
            <ul>
                <li><strong>Modal tiap order beda-beda.</strong> Harga supplier plus ongkir supplier bikin sulit dibuat
                    rumus satu baris.</li>
                <li><strong>Margin tipis, salah hitung langsung rugi.</strong> Lupa memasukkan ongkir atau biaya admin
                    marketplace membuat untung seolah besar.</li>
                <li><strong>Penjualan dari banyak platform.</strong> Shopee, Tokopedia, Instagram, TikTok — uang masuk
                    di waktu yang berbeda.</li>
                <li><strong>Cashback & biaya admin potong margin.</strong> Sering luput dicatat sehingga laporan menipu.</li>
                <li><strong>Susuk melacak status order.</strong> Bingung mana yang sudah lunas, mana yang masih diproses
                    supplier.</li>
            </ul>
            <p>Solusinya bukan menghindari dropship, tapi pakai alat pencatat yang <span class="highlight">paham struktur
                    biaya per order</span> dan dipakai setiap hari. Karena pekerjaan dropshipper mayoritas di HP, maka
                catat paling enak di WhatsApp.</p>

            <h2>Kenapa WhatsApp Cocok untuk Dropshipper</h2>
            <p>Sebagai dropshipper, kamu pasti sudah berlama-lama di WhatsApp: ngobrol sama pembeli, koordinasi sama
                supplier, cek resi. Mencatat keuangan di tempat yang sama bikin semuanya jadi satu ritme:</p>
            <ul>
                <li>✅ <strong>Gak perlu install app baru</strong> — WhatsApp sudah ada di HP kamu.</li>
                <li>✅ <strong>Catat tiap order begitu deal</strong> — sebelum nominalnya lupa.</li>
                <li>✅ <strong>Catat sambil ngobrol</strong> — barengan dengan pembeli dan supplier.</li>
                <li>✅ <strong>Bisa dipakai bareng mitra</strong> — pasangan atau admin dropship bisa input order juga.</li>
                <li>✅ <strong>Kirim foto bukti transfer</strong> — screenshot order dan bukti bayar supplier langsung
                    tersimpan.</li>
            </ul>

            <h2>Cara Kerja Pembukuan Dropshipper di WhatsApp</h2>
            <p>Mulainya cepat banget, cukup tiga langkah:</p>
            <ol>
                <li><strong>Chat nomor bot.</strong> Kirim pesan seperti chat biasa ke nomor WhatsApp resmi.</li>
                <li><strong>Catat order.</strong> Ketik <code>order kaos 2 pcs, modal supplier 40rb, jual 75rb, ongkir
                        12rb</code> atau kirim voice note <em>"tadi dropship sepatu modal 80 ribu jual 130 ribu"</em>.
                    Sistem otomatis mengenali nominal dan menghitung margin.</li>
                <li><strong>Cek margin & rekap.</strong> Ketik <code>rekap</code> untuk melihat total modal, omzet, dan
                    profit bersih. Detail lengkap bisa dicek di dashboard web.</li>
            </ol>
            <p>Kamu juga bisa mengirim <strong>foto bukti transfer atau screenshot order marketplace</strong>. Sistem
                akan membaca datanya dan mencatatnya sebagai transaksi, lengkap dengan nominal dan keterangan.</p>

            <h2>Beda Pencatatan Dropship dan Reseller</h2>
            <p>Banyak yang mengira dropship dan reseller sama. Dari sisi pembukuan, keduanya cukup berbeda dan harus
                diperlakukan berbeda:</p>
            <ul>
                <li><strong>Reseller</strong> membeli stok dulu, jadi ada nilai persediaan/aset. Pencatatannya perlu
                    melacak sisa barang dan harga pokok per batch.</li>
                <li><strong>Dropshipper</strong> gak punya stok. Tiap order langsung punya modal (harga supplier + ongkir
                    supplier) dan omzet (harga jual ke pembeli). Fokus pencatatan adalah <span class="highlight">margin
                        per order</span>, bukan nilai persediaan.</li>
            </ul>
            <p>Karena itu, <strong>aplikasi pembukuan dropshipper</strong> yang baik harus bisa menangkap komposisi
                biaya per order dalam satu input, menghitung margin otomatis, dan mengelompokkannya per kategori seperti
                modal, ongkir, dan biaya admin marketplace.</p>

            <h2>Fitur Penting untuk Dropshipper</h2>
            <p>Walaupun dicatat lewat chat, fiturnya lengkap untuk kebutuhan dropship harian:</p>
            <ul>
                <li><strong>Catat dengan AI (bahasa bebas)</strong> — paham gaya bahasa Indonesia & slang dropshipper.</li>
                <li><strong>Scan struk otomatis</strong> — kirim foto bukti transfer, data langsung terekam.</li>
                <li><strong>Catat via suara</strong> — voice note saat sibuk balas chat pembeli.</li>
                <li><strong>Kategori otomatis</strong> — modal, ongkir, jualan, biaya admin, jadi rapi.</li>
                <li><strong>Rekap harian & bulanan otomatis</strong> — lihat total margin tiap periode.</li>
                <li><strong>Export CSV/Excel</strong> — untuk audit atau evaluasi performa produk.</li>
                <li><strong>Utang & piutang + pengingat</strong> — tagih COD tertunggak gak akan lupa.</li>
            </ul>

            <p>Untuk dropshipper pemula yang baru rajin mencatat, paket <strong>Lite</strong> sudah cukup. Untuk dropship
                dengan puluhan order per hari dan butuh analisa margin per produk, naik ke <strong>Premium</strong> atau
                <strong>Pro</strong> supaya bisa pakai fitur Analisis Keuangan.</p>

            <h2>Tips Mengelola Keuangan Dropship</h2>
            <ul>
                <li><strong>Catat order begitu deal.</strong> Jangan tunggu akhir hari, nominal ongkir gampang lupa.</li>
                <li><strong>Pisahkan kategori biaya.</strong> Modal, ongkir, dan biaya admin marketplace dibuat terpisah
                    biar margin bersih jelas.</li>
                <li><strong>Rekap margin per produk.</strong> Cek produk mana yang margin-nya paling tebal, fokuskan
                    promosi ke sana.</li>
                <li><strong>Pantau piutang COD.</strong> Pakai pengingat tagihan biar pembeli gak lupa bayar.</li>
                <li><strong>Evaluasi tiap awal bulan.</strong> Bandingkan total margin dengan target untuk lihat tren.</li>
            </ul>

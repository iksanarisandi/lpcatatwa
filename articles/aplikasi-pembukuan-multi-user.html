            <h1>Aplikasi Pembukuan <span class="highlight">Multi User</span> untuk Tim & Karyawan</h1>

            <p class="lead">Punya toko dengan beberapa kasir atau karyawan, tapi pembukuan hanya dipegang satu orang?
                Dengan <strong>aplikasi pembukuan multi user</strong> berbasis WhatsApp, pemilik dan karyawan bisa
                mencatat penjualan serta pengeluaran dari nomor masing-masing — tanpa install app, tanpa pelatihan
                rumit.</p>

            <div class="cta-box">
                <p style="margin-bottom:16px"><strong>Coba gratis sekarang, langsung dari WhatsApp!</strong></p>
                <a href="https://wa.me/6285796731972?text=Halo%2C%20saya%20mau%20coba%20aplikasi%20pembukuan%20multi%20user%20untuk%20karyawan"
                    class="btn-cta" target="_blank" rel="noopener">Mulai Pembukuan Tim →</a>
            </div>

            <h2>Tantangan Pembukuan saat Usaha Punya Karyawan</h2>
            <p>Saat usaha masih sendiri, mencatat keuangan relatif gampang. Tapi begitu ada kasir, admin, atau karyawan
                lain, masalah mulai bermunculan. Penjualan diterima banyak orang, tapi catatan tetap dipegang satu
                orang. Akibatnya:</p>
            <ul>
                <li><strong>Pemilik kelelahan merekap.</strong> Setiap hari harus tanya kasir, "Tadi jualan berapa?"</li>
                <li><strong>Transaksi tertinggal.</strong> Yang dicatat hanya yang disampaikan, sisanya hilang.</li>
                <li><strong>Susah pantau kasir.</strong> Tidak ada bukti catatan real-time dari tiap shift.</li>
                <li><strong>Rentan selisih.</strong> Kas fisik dengan catatan sering tidak cocok di akhir hari.</li>
                <li><strong>Karyawan gak ikut mencatat.</strong> Karena aplikasi pembukuan terlalu ribet untuk mereka
                    pelajari.</li>
            </ul>
            <p>Solusinya adalah alat yang <span class="highlight">bisa dipakai semua orang dengan mudah</span>, lewat
                aplikasi yang sudah mereka kuasai: WhatsApp.</p>

            <h2>Kenapa WhatsApp Cocok untuk Pembukuan Tim</h2>
            <p>Menambahkan beban "belajar aplikasi baru" ke karyawan biasanya berakhir gagal. Tapi kalau alatnya
                WhatsApp, hambatan itu hilang:</p>
            <ul>
                <li>👥 <strong>Gak perlu install app baru</strong> — karyawan sudah pakai WhatsApp tiap hari.</li>
                <li>👥 <strong>Catat dari nomor masing-masing</strong> — tiap kasir chat bot yang sama.</li>
                <li>👥 <strong>Catat seperti chat teman</strong> — ketik bebas atau kirim voice note.</li>
                <li>👥 <strong>Tinggal chat, bukan input form</strong> — minim pelatihan, langsung jalan.</li>
                <li>👥 <strong>Pemilik tetap kontrol penuh</strong> — semua transaksi bisa diedit dari dashboard web.</li>
            </ul>

            <h2>Cara Kerja Pembukuan Multi User</h2>
            <p>Gampang banget, hanya tiga langkah:</p>
            <ol>
                <li><strong>Daftarkan nomor karyawan.</strong> Pemilik akun mendaftarkan nomor WhatsApp kasir atau
                    karyawan lewat dashboard atau chat bot.</li>
                <li><strong>Karyawan mencatat transaksi.</strong> Tiap karyawan chat nomor bot yang sama — ketik
                    <code>jual 2 kopi 36rb</code> atau kirim foto struk. Transaksi otomatis masuk ke pembukuan
                    usaha.</li>
                <li><strong>Pemilik memantau & merekap.</strong> Cek <code>rekap</code> kapan saja, lihat siapa catat
                    apa, dan lakukan edit/hapus lewat dashboard web kalau perlu.</li>
            </ol>
            <p>Karena setiap transaksi tercatat dari nomor yang berbeda, pemilik bisa tahu persis transaksi mana yang
                diinput oleh kasir A atau kasir B. Transparan dan akuntabel.</p>

            <h2>Pembagian Peran: Pemilik vs Karyawan</h2>
            <p>Dalam sistem multi user, pembagian peran penting supaya operasional tetap tertata:</p>
            <ul>
                <li><strong>Pemilik (admin).</strong> Mendaftarkan karyawan, melihat seluruh transaksi, mengedit atau
                    menghapus data, serta mengexport laporan untuk evaluasi bulanan.</li>
                <li><strong>Karyawan / kasir.</strong> Mencatat penjualan dan pengeluaran kecil operasional langsung
                    lewat chat — cepat, tanpa buka dashboard.</li>
                <li><strong>Multi cabang kecil.</strong> Tiap cabang atau shift bisa punya nomor sendiri sehingga
                    rekap per cabang jelas.</li>
            </ul>
            <p>Dengan begini, karyawan fokus ke input harian, sementara pemilik fokus ke analisa dan keputusan usaha.</p>

            <h2>Fitur Penting untuk Pembukuan Tim</h2>
            <p>Selain multi user, fitur lainnya menunjang operasional toko harian:</p>
            <ul>
                <li><strong>Catat teks / bahasa bebas (AI)</strong> — paham gaya bahasa Indonesia & slang kasir.</li>
                <li><strong>Scan struk OCR</strong> — foto nota pembelian modal, otomatis terekam.</li>
                <li><strong>Catat via suara</strong> — voice note untuk kasir yang lagi sibuk.</li>
                <li><strong>Kategori otomatis & rekap harian-bulanan</strong> — omzet shift langsung kelihatan.</li>
                <li><strong>Export CSV/Excel & dashboard web</strong> — laporan rapi untuk evaluasi tim.</li>
                <li><strong>Utang-piutang + pengingat & tabungan</strong> — kelola bon langganan dan target nabung.</li>
            </ul>

            <h2>Pilihan Paket Multi User untuk Tim</h2>

            <p>Untuk toko dengan satu kasir, paket <strong>Starter</strong> sudah mendukung +1 nomor karyawan. Untuk
                toko dengan beberapa kasir atau cabang kecil yang butuh analisa performa, naik ke <strong>Premium</strong>
                atau <strong>Pro</strong> dengan +2 sampai +4 nomor.</p>

            <h2>Tips Menerapkan Pembukuan Bareng Karyawan</h2>
            <ul>
                <li><strong>Arahkan semua input lewat chat.</strong> Gak perlu aplikasi terpisah, cukup chat bot.</li>
                <li><strong>Biasakan catat tiap transaksi.</strong> Minta kasir input saat transaksi terjadi, bukan
                    akhir shift.</li>
                <li><strong>Pakai kategori yang seragam.</strong> Sepakati istilah kategori biar rekapnya rapi.</li>
                <li><strong>Cek rekap tiap akhir hari.</strong> Bandingkan catatan dengan kas fisik supaya gak selisih.</li>
                <li><strong>Evaluasi karyawan lewat dashboard.</strong> Lihat tren penjualan per kasir atau per shift.</li>
            </ul>
